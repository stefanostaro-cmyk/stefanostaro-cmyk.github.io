<style>
/* Layout: tavola a tutta larghezza come su un tavolo da disegno; sotto, barra dei passi e didascalia del passo corrente */
:root {
  --paper: #f7f8f6; --sheet: #ffffff; --ink: #23262b; --ink-2: #5d636c; --rule: #d9dcd8;
  --blue: #1f5fbf; --red: #c23a2b; --faint: #b9c3cf; --old: #8c9098; --hatch: #6a6f77;
  --f-disp: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Literata", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #15181c; --sheet: #1c2026; --ink: #e6e8ea; --ink-2: #a7adb5; --rule: #343a42;
  --blue: #6ea4ff; --red: #ff7a66; --faint: #3f4a58; --old: #7b828c; --hatch: #9aa1aa; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #15181c; --sheet: #1c2026; --ink: #e6e8ea; --ink-2: #a7adb5; --rule: #343a42;
  --blue: #6ea4ff; --red: #ff7a66; --faint: #3f4a58; --old: #7b828c; --hatch: #9aa1aa; color-scheme: dark }
body { margin: 0; font-size: 16px; background: var(--paper); color: var(--ink); font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 { font-family: var(--f-disp); font-weight: 600; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: .01em;
  margin: 0; text-wrap: balance; text-transform: uppercase; }
.meta { font-family: var(--f-mono); font-size: .78rem; color: var(--ink-2); letter-spacing: .04em; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: clamp(8px, 2vw, 22px); overflow-x: auto; }
#tav { display: block; width: 100%; min-width: 560px; height: auto; }
#tav path, #tav line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
#tav text { font-family: var(--f-mono); fill: currentColor; stroke: none; }
.L { transition: opacity .35s ease; }
.contorni { color: var(--ink); stroke: var(--ink); stroke-width: .42; }
.contorni text { font-family: var(--f-disp); letter-spacing: .04em; }
.ombre { stroke: var(--old); stroke-width: .34; color: var(--old); }
.ombre[data-k="1"] { stroke: var(--red); color: var(--red); }
.ombre.cur { stroke: var(--red); color: var(--red); stroke-width: .42; }
.costruzioni { stroke: var(--faint); stroke-width: .18; stroke-dasharray: 1.1 .7; }
.costruzioni.cur { stroke: var(--blue); stroke-width: .22; }
.etichette { color: var(--old); stroke: var(--old); stroke-width: .15; }
.etichette.cur { color: var(--blue); stroke: var(--blue); }
.etichette .pt { fill: var(--sheet); }
#tav path.h31 { fill: url(#p31); stroke: none; }
#tav path.h37 { fill: url(#p37); stroke: none; }
#tav path.solid { fill: currentColor; stroke: none; }
.hl { stroke: var(--hatch); stroke-width: .16; }
.tratteggio { color: var(--hatch); }
.L.off { opacity: 0; visibility: hidden; }
.L.cur { animation: in .5s ease; }
@keyframes in { from { opacity: .15 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .L, .L.cur { transition: none; animation: none; } }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip { font-family: var(--f-mono); font-size: .85rem; width: 2.3rem; height: 2.3rem; border-radius: 50%;
  border: 1px solid var(--rule); background: var(--sheet); }
.chip[aria-current="step"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip.done { border-color: var(--ink-2); }
.nav { display: flex; gap: 8px; margin-left: auto; }
.btn { font-family: var(--f-disp); font-weight: 600; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase;
  padding: .45rem .95rem; border: 1px solid var(--ink); background: transparent; border-radius: 2px; }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn:disabled { opacity: .35; cursor: default; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.cap { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: 18px 40px; align-items: start; }
.cap h2 { font-family: var(--f-disp); font-weight: 600; font-size: 1.55rem; margin: 0 0 .35rem; text-wrap: balance; }
.cap h2 span { font-family: var(--f-mono); font-weight: 500; font-size: .9rem; color: var(--red); margin-right: .6rem; vertical-align: .15em; }
.cap p { margin: 0; max-width: 66ch; line-height: 1.62; font-size: 1.02rem; }
.legend { display: grid; gap: 8px; font-size: .9rem; color: var(--ink-2); }
.legend div { display: flex; align-items: center; gap: 10px; }
.sw { width: 34px; height: 14px; flex: none; }
.legend .t { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
@media (max-width: 760px) { .cap { grid-template-columns: 1fr; } .nav { margin-left: 0; } }
.crumb { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-2); width: 100%; }
.crumb a { color: var(--blue); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
</style>

const STEPS = [{"t": "I dati", "b": "Assonometria cavaliera (asse y a 45°, riduzione 1/2) di due muri a L: il muro A, frontale, con una nicchia; il muro B, ortogonale e sporgente in avanti, con un arco passante. La luce ha la direzione r, parallela alla diagonale del cubo; r' è la sua proiezione sul piano di terra."}, {"t": "Ombre proprie", "b": "Sono in ombra le facce rivolte dalla parte opposta alla luce: il fianco destro di B, la testata destra di A, lo stipite sinistro della nicchia. Negli intradossi la separatrice è la generatrice che passa per il punto in cui la tangente all'arco è parallela alla proiezione del raggio: a 45°."}, {"t": "Nicchia: ombra dello stipite", "b": "Lo spigolo verticale dello stipite getta sul davanzale un'ombra parallela a r', da A0 fino al fondo (K). Sul fondo, piano verticale, l'ombra sale verticale da K finché incontra il raggio r condotto da A: si ottiene A*."}, {"t": "Nicchia: ombra dell'arco", "b": "Il fondo è parallelo alla fronte: l'ombra dell'arco è una circonferenza uguale. Basta l'ombra del centro: C* sta sull'orizzontale per A*, alla distanza del raggio. Verso destra l'ombra lascia il fondo e passa sull'intradosso (punto 4*): lì si trova con i raggi dei singoli punti."}, {"t": "Muro B: ombra sul terreno e sulla facciata", "b": "Dal piede V0 si traccia r', dal vertice V il raggio r: l'incontro è V*. Il bordo superiore di B, parallelo a y, dà un'ombra parallela fino alla base della facciata (R). Sulla facciata: dal piede M0 la r' arriva al muro in Mt, si sale in verticale fino al raggio da M (M*). L'ombra sale fino a J, che sta già sul muro A."}, {"t": "Luce attraverso l'arco", "b": "Si costruiscono le ombre dei due bordi dell'arco: quello sul fianco esterno (P → P*) e quello sul fianco interno (Q → Q*), ciascuno spezzato tra terreno e facciata. La luce passa solo dove passa da entrambi: la parte comune delle due figure resta illuminata."}, {"t": "Ombra dentro l'arco", "b": "I raggi condotti dai punti dell'arco sul fianco esterno incontrano lo stipite posteriore e l'intradosso: unendo i punti d'ombra si ottiene l'ombra portata all'interno dell'arco."}, {"t": "La tavola finita", "b": "Ombre proprie a tratteggio semplice, ombre portate a tratteggio incrociato. Le linee di costruzione si possono lasciare sottili o cancellare."}];
const N = STEPS.length;
const groups = [...document.querySelectorAll('#tav .L')];
const chips = document.getElementById('chips');
let step = 1, timer = null;
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = i + 1; b.title = s.t;
  b.addEventListener('click', () => { stop(); go(i + 1); });
  chips.appendChild(b);
});
function go(k) {
  step = Math.max(1, Math.min(N, k));
  groups.forEach(g => {
    const gk = +g.dataset.k, aux = g.classList.contains('costruzioni') || g.classList.contains('etichette');
    const on = gk <= step && !(aux && step === N);
    g.classList.toggle('off', !on);
    g.classList.toggle('cur', on && gk === step);
  });
  [...chips.children].forEach((c, i) => {
    if (i + 1 === step) c.setAttribute('aria-current', 'step'); else c.removeAttribute('aria-current');
    c.classList.toggle('done', i + 1 < step);
  });
  document.getElementById('ct').innerHTML = '<span>' + String(step).padStart(2, '0') + ' / ' + String(N).padStart(2, '0') + '</span>' + STEPS[step - 1].t;
  document.getElementById('cb').textContent = STEPS[step - 1].b;
  document.getElementById('prev').disabled = step === 1;
  document.getElementById('next').disabled = step === N;
  try { localStorage.setItem('passo', step); } catch (e) {}
}
function stop() { clearInterval(timer); timer = null; const p = document.getElementById('play'); p.textContent = 'Riproduci'; p.setAttribute('aria-pressed', 'false'); }
document.getElementById('prev').addEventListener('click', () => { stop(); go(step - 1); });
document.getElementById('next').addEventListener('click', () => { stop(); go(step + 1); });
document.getElementById('play').addEventListener('click', () => {
  if (timer) { stop(); return; }
  if (step === N) go(1);
  const p = document.getElementById('play'); p.textContent = 'Pausa'; p.setAttribute('aria-pressed', 'true');
  timer = setInterval(() => { if (step >= N) stop(); else go(step + 1); }, 4500);
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); go(step + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(step - 1); }
});
let start = 1; try { start = +localStorage.getItem('passo') || 1; } catch (e) {}
go(start);
</script>

</body>
