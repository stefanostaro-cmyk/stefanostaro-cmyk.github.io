const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let AW, AH;
const MARGIN = 16;
const GAP = 0; // gap tra pezzi nella soluzione
let layout = 'v';
let numP = 12;
let pieces = [];
let dragging = null, dx = 0, dy = 0;
let imgs = [];
let displayScale = 1;
let imgSlots = [];

function seededRng(s) {
  let x = (s | 0) || 1;
  return () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
}

function computeSlots() {
  imgSlots = [];
  if (layout === 'v') {
    AW = 660; AH = 980;
    const slotW = AW - MARGIN * 2;
    const slotH = (AH - MARGIN * 3) / 2;
    imgs.forEach((img, ii) => {
      const sc = Math.min(slotW / img.naturalWidth, slotH / img.naturalHeight);
      const iw = Math.floor(img.naturalWidth * sc);
      const ih = Math.floor(img.naturalHeight * sc);
      imgSlots.push({
        x: MARGIN + Math.floor((slotW - iw) / 2),
        y: MARGIN + ii * (slotH + MARGIN) + Math.floor((slotH - ih) / 2),
        w: iw, h: ih, sc,
        srcW: img.naturalWidth, srcH: img.naturalHeight
      });
    });
  } else {
    AW = 980; AH = 580;
    const slotW = (AW - MARGIN * 3) / 2;
    const slotH = AH - MARGIN * 2;
    imgs.forEach((img, ii) => {
      const sc = Math.min(slotW / img.naturalWidth, slotH / img.naturalHeight);
      const iw = Math.floor(img.naturalWidth * sc);
      const ih = Math.floor(img.naturalHeight * sc);
      imgSlots.push({
        x: MARGIN + ii * (Math.floor(slotW) + MARGIN) + Math.floor((slotW - iw) / 2),
        y: MARGIN + Math.floor((slotH - ih) / 2),
        w: iw, h: ih, sc,
        srcW: img.naturalWidth, srcH: img.naturalHeight
      });
    });
  }
  canvas.width = AW; canvas.height = AH;
  const maxW = Math.min(window.innerWidth - 24, AW);
  displayScale = maxW / AW;
  canvas.style.width = Math.round(AW * displayScale) + 'px';
  canvas.style.height = Math.round(AH * displayScale) + 'px';
}

function buildPieces(n, seed) {
  pieces = [];
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);

  imgs.forEach((img, ii) => {
    const slot = imgSlots[ii];
    // Dimensione di ogni pezzo in pixel destinazione
    const pieceW = Math.floor((slot.w - GAP * (cols - 1)) / cols);
    const pieceH = Math.floor((slot.h - GAP * (rows - 1)) / rows);

    let cnt = 0;
    for (let ro = 0; ro < rows && cnt < n; ro++) {
      for (let co = 0; co < cols && cnt < n; co++, cnt++) {
        // Posizione del pezzo nella soluzione (coordinate foglio)
        const solvedX = slot.x + co * (pieceW + GAP);
        const solvedY = slot.y + ro * (pieceH + GAP);

        // Porzione sorgente corrispondente
        const srcX = Math.floor(co * slot.srcW / cols);
        const srcY = Math.floor(ro * slot.srcH / rows);
        const srcW = Math.floor(slot.srcW / cols);
        const srcH = Math.floor(slot.srcH / rows);

        // Crea offscreen canvas del pezzo
        const oc = document.createElement('canvas');
        oc.width = pieceW;
        oc.height = pieceH;
        const oc2 = oc.getContext('2d');
        oc2.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, pieceW, pieceH);



        pieces.push({ oc, w: pieceW, h: pieceH, solvedX, solvedY, imgIdx: ii, rot: 0 });
      }
    }
  });
  document.getElementById('pc').textContent = pieces.length;
}

function scatter(seed) {
  const r = seededRng(seed);
  pieces.forEach(p => {
    p.x = MARGIN + r() * Math.max(1, AW - p.w - MARGIN * 2);
    p.y = MARGIN + r() * Math.max(1, AH - p.h - MARGIN * 2);
    p.rot = 0;
  });
}

function solve() {
  pieces.forEach(p => {
    p.x = p.solvedX;
    p.y = p.solvedY;
    p.rot = 0;
  });
}

function draw() {
  ctx.clearRect(0, 0, AW, AH);
  ctx.fillStyle = '#f5f1e8';
  ctx.fillRect(0, 0, AW, AH);
  pieces.forEach(p => {
    ctx.save();
    if (p.rot) {
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
      ctx.translate(cx, cy); ctx.rotate(p.rot); ctx.translate(-cx, -cy);
    }
    ctx.shadowColor = 'rgba(0,0,0,0.18)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;
    ctx.drawImage(p.oc, p.x, p.y);
    ctx.restore();
  });
}

function clientToCanvas(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return [(cx - r.left) / displayScale, (cy - r.top) / displayScale];
}

function hit(cx, cy) {
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    if (cx >= p.x && cx <= p.x + p.w && cy >= p.y && cy <= p.y + p.h) return i;
  }
  return -1;
}

canvas.addEventListener('mousedown', e => {
  const [cx, cy] = clientToCanvas(e.clientX, e.clientY);
  const i = hit(cx, cy); if (i < 0) return;
  const p = pieces.splice(i, 1)[0]; pieces.push(p);
  dragging = pieces.length - 1; dx = cx - p.x; dy = cy - p.y; e.preventDefault();
});
canvas.addEventListener('mousemove', e => {
  if (dragging === null) return;
  const [cx, cy] = clientToCanvas(e.clientX, e.clientY);
  pieces[dragging].x = cx - dx; pieces[dragging].y = cy - dy; draw(); e.preventDefault();
});
canvas.addEventListener('mouseup', () => dragging = null);
canvas.addEventListener('mouseleave', () => dragging = null);
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  const [cx, cy] = clientToCanvas(t.clientX, t.clientY);
  const i = hit(cx, cy); if (i < 0) return;
  const p = pieces.splice(i, 1)[0]; pieces.push(p);
  dragging = pieces.length - 1; dx = cx - p.x; dy = cy - p.y; e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  if (dragging === null) return;
  const t = e.touches[0];
  const [cx, cy] = clientToCanvas(t.clientX, t.clientY);
  pieces[dragging].x = cx - dx; pieces[dragging].y = cy - dy; draw(); e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchend', () => dragging = null);

document.getElementById('btn-shuffle').addEventListener('click', () => {
  scatter(Date.now() % 99999); draw();
});
document.getElementById('btn-more').addEventListener('click', () => {
  if (numP >= 36) return;
  numP += 4; computeSlots(); buildPieces(numP, 42); scatter(77); draw();
});
document.getElementById('btn-less').addEventListener('click', () => {
  if (numP <= 8) return;
  numP -= 4; computeSlots(); buildPieces(numP, 42); scatter(77); draw();
});
document.getElementById('sel-layout').addEventListener('change', e => {
  layout = e.target.value; computeSlots(); buildPieces(numP, 42); scatter(99); draw();
});

const i1 = new Image(), i2 = new Image();
let loaded = 0;
function tryBuild() {
  if (++loaded === 2) {
    imgs = [i1, i2];
    computeSlots();
    buildPieces(numP, 42);
    scatter(99);
    draw();
  }
}
i1.onload = tryBuild; i2.onload = tryBuild;
i1.src = IMG1; i2.src = IMG2;
</script>
